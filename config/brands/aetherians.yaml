# "Aetherians" - zodiac, crystals, constellations, sky myths and sound, in the
# style of the owner's Aetherians books (the DPF project).
#
# Starts from the main config/config.example.yaml and changes only what makes
# this channel different. Its own database, videos, saved narration, Buffer
# account and learning, all under data/backups/brands/aetherians/ (the
# workflows only keep data/ghostcash.db and data/backups). Run any command for
# this channel with:
#
#     ghostcash --config config/brands/aetherians.yaml <command>
#
# In the scheduled workflows since 2026-11-24 (after Old Wisdom).
extends: ../config.example.yaml

brand:
  key: aetherians
  name: "Aetherians"
  description: >-
    richly illustrated short videos about the zodiac, crystals, constellations,
    the old myths behind the stars, and sound rituals: what each thing is, the
    story or tradition around it, and one small way to enjoy it today
  categories_file: config/brands/aetherians_categories.yaml
  templates_dir: templates/video/aetherians
  buffer_api_key_env: BUFFER_API_KEY_AETHERIANS
  # Its own Gumroad shop (aetherians.gumroad.com or similar).
  gumroad_api_key_env: GUMROAD_API_KEY_AETHERIANS

database_path: data/backups/brands/aetherians/ghostcash.db

backup:
  backup_dir: data/backups/brands/aetherians/backups

publishing:
  posts_per_day: 2
  youtube_category_id: "27"

# Drafts first: every video waits in Buffer until the owner approves it.
human_approval_mode:
  publishing: APPROVAL_REQUIRED

content:
  topics_per_run: 12
  content_per_run: 3
  # Shop live since 2026-11-28 (aetherians.gumroad.com, free sampler first in
  # the Instagram and YouTube links). Owner asked for a catchy "link in bio"
  # call to action on new videos.
  cta_guidance: >-
    One short spoken line (under 14 words) that points to the link in bio.
    Match it to the video's subject: zodiac signs and astrology -> "The
    Turning Zodiac" book; crystals, stones and sound -> "Crystals & Mystic
    Frequencies"; constellations, stars and myths -> "The Orphic Sky";
    anything else -> the free illustrated sampler. Alternate between offering
    the free sampler and naming the matching book, for example "Want the
    whole story of Leo? It's in The Turning Zodiac - link in bio." or "Free
    illustrated sampler in the link in bio." Warm and curious, never pushy:
    no urgency, no discounts, no "limited", no promises of results, and only
    the sampler is ever called free. Never offer anything else (no comment
    keywords, no messages, no courses, no newsletters).
  reject_unavailable_offers: false
  caption_footer: "✦ Free illustrated sampler + the full books: link in bio"
  writing_guidance: >-
    One subject per video: one zodiac sign, one crystal, one constellation or
    star, one myth, or one sound practice. Give one or two real facts (where
    the stars are, what the stone is made of, who told the myth), then the
    tradition or meaning people give it, clearly framed as tradition ("in
    astrology", "in crystal practice", "the Greeks told"), never as proven
    fact. End with one small, pleasant thing to try (look for the
    constellation tonight, hold the stone to the light). Warm, wondering,
    unhurried tone. No predictions about the viewer's future, no health,
    healing, money or love promises, no fear.
  forbidden_phrases:
    - cure
    - cures
    - heal
    - heals
    - healing
    - anxiety
    - depression
    - trauma
    - medication
    - diagnose
    - guaranteed
    - scientifically proven
    - studies show
    - manifest money
    - manifest wealth
    - get rich
    - will happen to you

video:
  output_dir: assets/generated/aetherians
  audio_cache_dir: data/backups/brands/aetherians/audio
  render_per_run: 3
  tts_gemini_voice: Charon
  tts_gemini_style: "warm, quietly wondering storyteller, unhurried, like telling an old myth by candlelight"
  # Owner (2026-11-22): music a bit louder than the default -24 LUFS. The
  # voice is levelled to -16, so this sits about 4 LU under it (and dips a
  # little more while the narrator speaks).
  music_target_lufs: -20.0
  # The owner's own tracks (see assets/brands/aetherians/music/README.md).
  music_files:
    - assets/brands/aetherians/music/aetherians_01.mp3
    - assets/brands/aetherians/music/aetherians_02.mp3
    - assets/brands/aetherians/music/aetherians_03.mp3
    - assets/brands/aetherians/music/aetherians_04.mp3
    - assets/brands/aetherians/music/aetherians_05.mp3
