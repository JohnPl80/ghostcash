name: Health Check

# CLAUDE.md section 36. Verifies: database accessible, AI/Buffer/Gumroad
# API accessible (real connectivity checks, not just "is the secret
# set" - see ghostcash/health.py), required environment variables
# present, disk space sufficient, queue healthy, last successful job
# recent. All of it lives in `ghostcash health` (shared with the Phase
# 9 dashboard's /system page via ghostcash/health.py's check_system(),
# so the two can never disagree) - this workflow is a thin scheduler
# around it, standing in for a NotificationProvider that doesn't exist
# yet (section 38): a failed run here is a real, zero-setup alert via
# GitHub's own default workflow-failure notification to the repo's
# watchers/owners.
#
# Runs against the same persisted database as the other three
# workflows (see nightly.yml's header for the full persistence design
# and the shared `concurrency.group`) so "last successful job recent"
# actually reflects real pipeline history instead of an empty,
# freshly-initialized database every single hour.

on:
  schedule:
    - cron: "0 * * * *" # hourly
  workflow_dispatch: {}

concurrency:
  group: ghostcash-db-state

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # DO NOT add or remove paths in this list (here or in the matching save
      # step, in any workflow). GitHub ties each saved copy to the exact list
      # of folders; change the list and every earlier save becomes invisible,
      # so the next run silently starts from an empty database. Anything else
      # that must persist (such as saved narration audio) lives INSIDE one of
      # these folders - see video.audio_cache_dir.
      - name: Restore persisted database + backups
        id: restore_db
        uses: actions/cache/restore@v6
        with:
          path: |
            data/ghostcash.db
            data/backups
          key: ghostcash-data-${{ github.run_id }}
          restore-keys: |
            ghostcash-data-

      # If GitHub cannot find the saved data, STOP here (the run fails, which
      # also alerts the owner) instead of carrying on with an empty database
      # and then saving that empty database as the newest copy - which hides
      # every good copy from all later runs. That happened on 2026-10-30 and
      # lost the main channel's history. The next scheduled run simply tries
      # again. Only for a genuine fresh start, set the repository variable
      # GHOSTCASH_ALLOW_EMPTY_START to true (Settings -> Secrets and
      # variables -> Actions -> Variables) for one run, then delete it.
      - name: Stop if no saved database was found
        if: steps.restore_db.outputs.cache-matched-key == ''
        env:
          ALLOW_EMPTY_START: ${{ vars.GHOSTCASH_ALLOW_EMPTY_START }}
        run: |
          if [ "$ALLOW_EMPTY_START" = "true" ]; then
            echo "::warning title=No saved database::Starting from an EMPTY database because GHOSTCASH_ALLOW_EMPTY_START is true. Delete that variable after this run."
            echo "[WARN] NO SAVED DATABASE FOUND - starting empty on purpose (GHOSTCASH_ALLOW_EMPTY_START)."
            exit 0
          fi
          echo "::error title=No saved database::GitHub could not find the saved GhostCash data, so this run stopped without changing anything. The next run tries again; if this repeats, see README, Troubleshooting."
          echo "[WARN] NO SAVED DATABASE FOUND - stopping so an empty database is never saved over the real one."
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (ffmpeg with libflite, fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core

      - name: Install GhostCash
        run: pip install -e ".[dev]"

      - name: Prepare local config (first run only)
        run: cp -n config/config.example.yaml config/config.yaml || true

      - name: Run health check
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          GUMROAD_API_KEY: ${{ secrets.GUMROAD_API_KEY }}
          DATABASE_PATH: data/ghostcash.db
        run: |
          ghostcash init
          ghostcash health

      - name: Persist database for the next run
        # Never after a missed restore (see the stop step above).
        if: always() && (steps.restore_db.outputs.cache-matched-key != '' || vars.GHOSTCASH_ALLOW_EMPTY_START == 'true')
        uses: actions/cache/save@v6
        with:
          path: |
            data/ghostcash.db
            data/backups
          key: ghostcash-data-${{ github.run_id }}
